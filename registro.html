<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Ludopati</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="nav container">
            <div class="nav__brand">
                <h1 class="nav__logo">🎮 Ludopati</h1>
            </div>
            <ul class="nav__menu" id="navMenu">
                <li class="nav__item">
                    <a href="index.html" class="nav__link">Inicio</a>
                </li>
                <li class="nav__item">
                    <a href="catalogo.html" class="nav__link">Catálogo</a>
                </li>
                <li class="nav__item">
                    <a href="comunidad.html" class="nav__link">Comunidad</a>
                </li>
                <li class="nav__item">
                    <a href="carrito.html" class="nav__link">
                        Carrito <span class="cart-badge" id="cartBadge">0</span>
                    </a>
                </li>
            </ul>
            <div class="nav__auth" id="navAuth">
                <a href="login.html" class="btn btn--secondary">Iniciar Sesión</a>
                <a href="registro.html" class="btn btn--primary">Registrarse</a>
            </div>
            <div class="nav__user" id="navUser" style="display: none;">
                <span class="nav__username" id="navUsername"></span>
                <button class="btn btn--secondary" id="logoutBtn">Cerrar Sesión</button>
            </div>
            <button class="nav__toggle" id="navToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>
    </header>

    <section class="auth__container">
        <div class="auth__card">
            <h1 class="auth__title">Crear Cuenta</h1>
            <p class="auth__subtitle">Únete a la comunidad de Ludopati</p>
            
            <div id="alert"></div>
            
            <form id="registerForm">
                <div class="form__group">
                    <label class="form__label" for="username">Nombre de Usuario</label>
                    <input type="text" id="username" class="form__input" placeholder="Tu nombre de usuario" required>
                </div>
                
                <div class="form__group">
                    <label class="form__label" for="email">Correo Electrónico</label>
                    <input type="email" id="email" class="form__input" placeholder="tu@email.com" required>
                </div>
                
                <div class="form__group">
                    <label class="form__label" for="password">Contraseña</label>
                    <input type="password" id="password" class="form__input" placeholder="Mínimo 6 caracteres" required minlength="6">
                </div>
                
                <button type="submit" class="btn btn--primary" style="width: 100%;">Registrarse</button>
            </form>
            
            <div class="auth__footer">
                <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
